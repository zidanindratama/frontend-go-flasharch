name: Deploy Frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-frontend-production
  cancel-in-progress: false

env:
  NEXT_PUBLIC_APP_URL: https://flasharch.my.id
  NEXT_PUBLIC_API_URL: https://api.flasharch.my.id/api/v1
  NEXT_PUBLIC_LOAD_TEST_API_URL: https://loadtest-api.flasharch.my.id/api/v1

jobs:
  test:
    name: Test and Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lint
        continue-on-error: true
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to VPS
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Deploy over SSH
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS_HOST }}
          port: ${{ secrets.VPS_PORT }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_PRIVATE_KEY }}
          script: |
            set -euo pipefail

            cd /opt/flasharch/frontend-go-flasharch
            git fetch origin main
            git reset --hard origin/main
            git clean -fd

            cat > .env.production <<'EOF'
            NEXT_PUBLIC_APP_URL=https://flasharch.my.id
            NEXT_PUBLIC_API_URL=https://api.flasharch.my.id/api/v1
            NEXT_PUBLIC_LOAD_TEST_API_URL=https://loadtest-api.flasharch.my.id/api/v1
            EOF

            docker compose --env-file .env.production -f docker-compose.production.yml up -d --build frontend
            docker image prune -f
