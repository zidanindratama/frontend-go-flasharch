name: flasharch-frontend-production

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL}
        NEXT_PUBLIC_LOAD_TEST_API_URL: ${NEXT_PUBLIC_LOAD_TEST_API_URL}
    container_name: flasharch-frontend-production
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      HOSTNAME: 0.0.0.0
      PORT: 3000
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "127.0.0.1:3001:3000"
    restart: unless-stopped
